<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente de voz IA — demo</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0b0f;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  p.subtitle { color: #999; margin-top: 0; margin-bottom: 32px; }
  button {
    font-size: 1.1rem;
    padding: 16px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: #4f46e5;
    color: white;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #4338ca; }
  button:active { transform: scale(0.97); }
  button:disabled { background: #333; cursor: not-allowed; }
  button.listening { background: #dc2626; }
  #status { margin-top: 20px; color: #9ca3af; font-size: 0.9rem; min-height: 1.2em; }
  #log {
    margin-top: 24px;
    max-width: 480px;
    font-size: 0.8rem;
    color: #6b7280;
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>
  <h1>Agente de voz IA — 100% open source</h1>
  <p class="subtitle">Landing page minima de validacion (v1). Etapa 3 del roadmap.</p>

  <button id="talk-btn">Hablar con el agente</button>
  <div id="status">Desconectado</div>
  <div id="log"></div>

  <script>
    const btn = document.getElementById("talk-btn");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    let room = null;
    let connected = false;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
    }

    async function connectToAgent() {
      btn.disabled = true;
      statusEl.textContent = "Pidiendo token...";

      const resp = await fetch("/token", { method: "POST" });
      if (!resp.ok) {
        statusEl.textContent = "Error obteniendo el token. Revisa el token-server.";
        btn.disabled = false;
        return;
      }
      const { token, url } = await resp.json();

      statusEl.textContent = "Conectando a la sala...";
      room = new LivekitClient.Room();

      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === "audio") {
          const audioEl = track.attach();
          document.body.appendChild(audioEl);
          log("Reproduciendo audio del agente");
        }
      });

      room.on(LivekitClient.RoomEvent.Disconnected, () => {
        statusEl.textContent = "Desconectado";
        btn.textContent = "Hablar con el agente";
        btn.classList.remove("listening");
        btn.disabled = false;
        connected = false;
      });

      await room.connect(url, token);
      await room.localParticipant.setMicrophoneEnabled(true);

      connected = true;
      statusEl.textContent = "Conectado. El agente te esta escuchando.";
      btn.textContent = "Colgar";
      btn.classList.add("listening");
      btn.disabled = false;
      log("Sala conectada, microfono publicado");
    }

    async function disconnectFromAgent() {
      if (room) {
        await room.disconnect();
        room = null;
      }
    }

    btn.addEventListener("click", async () => {
      try {
        if (!connected) {
          await connectToAgent();
        } else {
          await disconnectFromAgent();
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error: " + err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
